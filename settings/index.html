<!doctype html>
<html>
  <head>
    <!-- The '/homey.js' script must be included in your settings view to work -->
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <style>
      .hidden {
        display: none;
      }
      .center {
        text-align: center;
      }
      .homey-form-group {
        margin-bottom: 1rem;
      }
      /* Chromium repaints an autofilled input with its own background and text
         colour, which it will not let CSS override — so the email field (the
         only one a browser autofills here) ends up looking unlike the password
         and code fields. Deferring the background transition indefinitely keeps
         Homey's own styling, and works in light and dark theme alike. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-text-fill-color: currentColor;
        transition: background-color 100000s ease-in-out 0s;
      }
    </style>
  </head>
  <body>
    <header class="homey-header">
      <h1 class="homey-title" data-i18n="settings.title"></h1>
    </header>

    <div id="connect-container" class="hidden">
      <fieldset class="homey-form-fieldset">
        <div class="homey-form-group">
          <label class="homey-form-label" for="email" data-i18n="settings.email"></label>
          <input class="homey-form-input" type="email" id="email" autocomplete="username" />
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="password" data-i18n="settings.password"></label>
          <input class="homey-form-input" type="password" id="password" autocomplete="current-password" />
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="otp" data-i18n="settings.otp"></label>
          <input class="homey-form-input" type="text" id="otp" inputmode="numeric" autocomplete="one-time-code" />
          <p class="homey-form-hint" data-i18n="settings.otpHint"></p>
        </div>
      </fieldset>

      <button id="connect" class="homey-button-primary-full" data-i18n="settings.connect"></button>
      <button id="reset" class="homey-button-danger-full" data-i18n="settings.reset"></button>
    </div>

    <div id="connecting-container" class="hidden">
      <h1 class="homey-title center" data-i18n="settings.connecting"></h1>
      <button class="homey-button-primary-full is-loading" disabled></button>
    </div>

    <div id="connected-container" class="hidden">
      <h1 class="homey-title center" data-i18n="settings.connected"></h1>
      <p class="homey-subtitle center" data-i18n="settings.success"></p>
      <button id="disconnect" class="homey-button-danger-full" data-i18n="settings.disconnect"></button>
    </div>

    <!-- Always visible: the server a session talks to matters even before sign-in. -->
    <div id="server-container" class="homey-form-group">
      <hr />
      <label class="homey-form-label" for="amazon-site" data-i18n="settings.server"></label>
      <select class="homey-form-select" id="amazon-site">
        <option value="" data-i18n="settings.serverAuto"></option>
        <option value="amazon.com">amazon.com</option>
        <option value="amazon.ca">amazon.ca</option>
        <option value="amazon.com.mx">amazon.com.mx</option>
        <option value="amazon.com.br">amazon.com.br</option>
        <option value="amazon.co.uk">amazon.co.uk</option>
        <option value="amazon.de">amazon.de</option>
        <option value="amazon.fr">amazon.fr</option>
        <option value="amazon.it">amazon.it</option>
        <option value="amazon.es">amazon.es</option>
        <option value="amazon.nl">amazon.nl</option>
        <option value="amazon.in">amazon.in</option>
        <option value="amazon.co.jp">amazon.co.jp</option>
        <option value="amazon.com.au">amazon.com.au</option>
      </select>
      <p class="homey-form-hint" data-i18n="settings.serverHint"></p>
    </div>

    <!-- Always visible: lets users turn on detailed logging before reproducing a problem. -->
    <div id="diagnostics-container" class="homey-form-group">
      <hr />
      <label class="homey-form-checkbox">
        <input class="homey-form-checkbox-input" type="checkbox" id="debug-logging" />
        <span class="homey-form-checkbox-checkmark"></span>
        <span class="homey-form-checkbox-text" data-i18n="settings.debugLogging"></span>
      </label>
      <p class="homey-form-hint" data-i18n="settings.debugLoggingHint"></p>
    </div>

    <script type="text/javascript">
      const showView = (view) => {
        document.getElementById('connect-container').classList.toggle('hidden', view !== 'form');
        document.getElementById('connecting-container').classList.toggle('hidden', view !== 'connecting');
        document.getElementById('connected-container').classList.toggle('hidden', view !== 'connected');
      };

      function onHomeyReady(Homey) {
        // Only alert an error if it followed a connect attempt the user made on this page
        // (avoids popping a stale error on load).
        let attempted = false;
        // Don't let status polling overwrite the controls while a change is in flight.
        let debugPending = false;
        let sitePending = false;

        // Turn a few known technical errors into a clearer, translated explanation.
        // The raw message is still kept in the app log / diagnostic report.
        const friendlyError = (error) => {
          const msg = typeof error === 'string' ? error : (error && error.message) || '';
          if (msg.indexOf('MFA OTP code not found') !== -1) {
            return Homey.__('settings.errorOtpPage');
          }
          return error;
        };

        const checkStatus = () => {
          Homey.api('GET', '/status', undefined, (err, res) => {
            if (err || !res) return;
            if (!debugPending) {
              document.getElementById('debug-logging').checked = !!res.debugLogging;
            }
            if (!sitePending) {
              const select = document.getElementById('amazon-site');
              select.value = res.site || '';
              select.dataset.previous = res.site || '';
            }
            if (res.state === 'connected') {
              attempted = false;
              showView('connected');
            } else if (res.state === 'connecting') {
              showView('connecting');
            } else {
              showView('form');
              if (attempted && res.error) {
                attempted = false;
                Homey.alert(friendlyError(res.error));
              }
            }
          });
        };

        checkStatus();
        setInterval(checkStatus, 2000);
        Homey.ready();

        document.getElementById('connect').addEventListener('click', () => {
          const body = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            otp: document.getElementById('otp').value,
          };
          attempted = true;
          showView('connecting'); // immediate feedback; polling takes over
          Homey.api('POST', '/connect', body, (err) => {
            if (err) {
              attempted = false;
              showView('form');
              return Homey.alert(err);
            }
            document.getElementById('password').value = '';
            document.getElementById('otp').value = '';
          });
        });

        document.getElementById('disconnect').addEventListener('click', () => {
          Homey.api('POST', '/disconnect', undefined, (err) => {
            if (err) return Homey.alert(err);
            showView('form');
          });
        });

        document.getElementById('reset').addEventListener('click', () => {
          Homey.api('POST', '/reset', undefined, (err) => {
            if (err) return Homey.alert(err);
            showView('form');
          });
        });

        document.getElementById('amazon-site').addEventListener('change', (e) => {
          const site = e.target.value;
          const previous = e.target.dataset.previous || '';
          sitePending = true;
          // Reconnecting on the new server takes a moment; polling shows the result.
          Homey.api('POST', '/amazon-site', { site }, (err) => {
            sitePending = false;
            if (err) {
              e.target.value = previous;
              return Homey.alert(err);
            }
            e.target.dataset.previous = site;
          });
        });

        document.getElementById('debug-logging').addEventListener('change', (e) => {
          const enabled = e.target.checked;
          debugPending = true;
          Homey.api('POST', '/debug-logging', { enabled }, (err) => {
            debugPending = false;
            if (err) {
              e.target.checked = !enabled;
              return Homey.alert(err);
            }
          });
        });
      }
    </script>
  </body>
</html>
