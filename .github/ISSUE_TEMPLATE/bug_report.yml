name: Bug Report
description: Report a problem with the Echo app. Please complete the troubleshooting checklist first.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before you open an issue

        Most problems can be resolved with the steps below. Please work through
        them **before** submitting this form.

        ### Common troubleshooting steps

        1. **On Homey Self-Hosted (SHS): run the container in privileged mode**
            The Homey container must run privileged, otherwise Homey's Python runtime does not work at all
            and this app cannot start. If you are on SHS and the app fails to start or immediately goes
            offline, check this first — add `--privileged` to your `docker run` command, or
            `privileged: true` to the service in your `docker-compose.yml`, then recreate the container.

        2. **Use an authenticator-app code**
            Amazon requires 2-step verification with an authenticator app (e.g. Google Authenticator, Microsoft Authenticator).
            **SMS or email codes will NOT work** — sign-in will fail saying Amazon never showed the authenticator-code step.

        3. **Re-connect**
            Echo app settings → **Disconnect** → **Connect** again with your email, password and a **fresh** authenticator code.
            If that still fails, press **Reset** first to fully clear the stored session, then connect again.

        4. **Coming from version 1.x?**
            You have to sign in once after updating — the old login is not compatible. If you used the **Run Routine**
            flow card, re-select your routine, as routines are now matched by name.

        5. **Leave "Amazon server" on Auto**
            Your region is detected automatically; there is no website to pick. Only choose a country if connecting fails
            because your network cannot reach that server — and say so below if you did.

        6. **Uninstall conflicting Alexa apps**
            If another Alexa Homey app is installed (e.g. the "Alexa" app), disable or uninstall it — they interfere
            with each other's authentication.

        7. **Check your DNS settings**
            Some routers (e.g. eero) and ad/tracker filters hijack or drop DNS and break the login. Try Google DNS
            (`8.8.8.8`) or Cloudflare DNS (`1.1.1.1`). App settings also has a **Run network test** button that records
            exactly what your network answers — run it while the problem is happening.

        8. **Update the app**
            Make sure you are running the latest version of the Echo app.

        > **Capturing a useful report:** in app settings, turn on **Enable diagnostic logging**, reproduce the problem,
        > then send a diagnostic report from Homey and paste the ID below. Turn it off again afterwards. Without this,
        > a diagnostic report usually does not contain enough detail to find the cause.

  - type: checkboxes
    id: troubleshooting
    attributes:
      label: Troubleshooting checklist
      description: Please confirm you have tried the steps above.
      options:
        - label: My Homey runs firmware **13.0.0 or newer** (required — the app will not install otherwise)
          required: true
        - label: I am **not** running Homey Self-Hosted, **or** my Homey container runs in **privileged mode**
          required: true
        - label: I have 2-step verification enabled using an **authenticator app** (not SMS/email)
          required: true
        - label: I have tried Disconnect → Connect with a fresh code (and Reset if that failed)
          required: true
        - label: I do not have another Alexa app installed or enabled on Homey
          required: true
        - label: I am running the latest version of the Echo app
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: Describe the issue...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: What is affected?
      description: Which part of the app is the problem in?
      options:
        - Signing in / connection
        - Adding devices (pairing)
        - Speech — Say Message / Say with Voice / announcements
        - Playback, volume or now-playing info
        - Sounds or routines
        - Do Not Disturb
        - Screen controls (Echo Show / Spot / Dot with clock)
        - Alexa lists (shopping / to-do)
        - Something else
    validations:
      required: true

  - type: textarea
    id: error-message
    attributes:
      label: Error message
      description: |
        If you see an error, paste it here — from app settings, a Flow card that failed, or a device.
        **Tip:** the app's error trigger card (WHEN → Echo error) connected to a notification captures connection errors as they happen.
      render: text

  - type: input
    id: echo-device
    attributes:
      label: Echo device model
      description: Which Echo device(s) are affected? Write "speaker group" if it is a multi-room group.
      placeholder: e.g. Echo Dot 5th Gen

  - type: input
    id: amazon-server
    attributes:
      label: '"Amazon server" setting'
      description: What is the Amazon server setting in app settings set to? If you picked a country instead of Auto, say why.
      placeholder: e.g. Auto (recommended), or "Germany — Auto could not connect"

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. 2.2.3
    validations:
      required: true

  - type: dropdown
    id: homey-model
    attributes:
      label: Which Homey are you running?
      options:
        - Homey Pro (2026)
        - Homey Pro (2023)
        - Homey Self-Hosted (SHS)
        - Not sure
    validations:
      required: true

  - type: input
    id: homey-firmware
    attributes:
      label: Homey firmware version
      description: Homey app → Settings → General → About.
      placeholder: e.g. 13.1.0
    validations:
      required: true

  - type: input
    id: diagnostic-id
    attributes:
      label: Diagnostic report ID
      description: |
        Turn on **Enable diagnostic logging** in app settings, reproduce the problem, then send a diagnostic
        report from Homey and paste the ID here.
      placeholder: e.g. abc12345-...

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help (screenshots, your Flow setup, when it started, whether it ever worked).
